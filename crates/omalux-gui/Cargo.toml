[package]
name = "omalux-gui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Qt Quick desktop interface for Omalux"
homepage = "https://github.com/chriopter/omalux"
repository = "https://github.com/chriopter/omalux"

[features]
default = ["heic"]
heic = ["omalux/heic"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["full"] }
omalux = { path = "../..", version = "=0.1.0" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[dev-dependencies]
