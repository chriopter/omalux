[package]
name = "grainroom"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A focused photo developer for Omarchy"

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["full"] }
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }
