[workspace]
members = ["crates/grainroom-gui"]
default-members = ["."]
resolver = "2"

[package]
name = "grainroom"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A focused photo developer for Omarchy"
homepage = "https://github.com/chriopter/grainroom"
repository = "https://github.com/chriopter/grainroom"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
lcms2 = "6.1.1"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
getrandom = "0.4"
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
