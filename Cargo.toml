[workspace]
members = ["crates/omalux-gui"]
default-members = ["."]
resolver = "2"

[package]
name = "omalux"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A focused photo developer for Omarchy"
homepage = "https://github.com/chriopter/omalux"
repository = "https://github.com/chriopter/omalux"

[features]
default = []
heic = ["dep:libheif-sys"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
ctrlc = "3.5"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
lcms2 = "6.1.1"
libheif-sys = { version = "5.3.1", optional = true, default-features = false, features = ["v1_23"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
getrandom = "0.4"
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
